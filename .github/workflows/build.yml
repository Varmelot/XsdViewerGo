name: Build

on:
  push:
    tags:
      - 'v*'          # запускается когда пушишь тег вида v1.0.0
  workflow_dispatch:  # или вручную из интерфейса GitHub

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary: XsdViewerGo
            build_args: -tags webkit2_41
          - os: macos-latest
            name: macos
            binary: XsdViewerGo
            build_args: ''
          - os: windows-latest
            name: windows
            binary: XsdViewerGo.exe
            build_args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build
        run: wails build -ldflags="-s -w" ${{ matrix.build_args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XsdViewerGo-${{ matrix.name }}
          path: build/bin/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/XsdViewerGo-linux/XsdViewerGo
            artifacts/XsdViewerGo-macos/XsdViewerGo
            artifacts/XsdViewerGo-windows/XsdViewerGo.exe
